name: Validate ReaBoot package

on:
  push:
    paths:
      - index.xml
      - reaboot.json
      - README.md
      - tests/test_reaboot_package.py
      - .github/workflows/reaboot.yml
  pull_request:
    paths:
      - index.xml
      - reaboot.json
      - README.md
      - tests/test_reaboot_package.py
      - .github/workflows/reaboot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate ReaPack index, recipe and immutable source hashes
        run: python -m pytest tests/test_reaboot_package.py -q
